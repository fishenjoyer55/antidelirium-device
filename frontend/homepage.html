<!DOCTYPE html>
<html>
    <head>
        <title>Antidelirium Device</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
        <script src="lib/chart.umd.min.js"></script>
    </head>
    <body>
        <div id="sidebar">
            <div id="quicklinkContainer">
                <p id="homeQuicklink" class="quicklink">Home</p>
                <p id="userQuicklink" class="quicklink">
                    User
                </p>
                <p id="analyticsQuicklink" class="quicklink">
                    Analytics
                </p>
                <p id="infoQuicklink" class="quicklink">
                    Info
                </p>
            </div>
        </div>
        <div id="pages">
            <div id="home" class="page active">
                <h1>ECE198 Group 33 Antidelirium Page</h1>
                <div id="slideshow">
        
                </div>
                <div id="previewContainer">
                    <div id="userPreview" class="preview">

                    </div>
                    <div id="analyticsPreview" class="preview">

                    </div>
                    <div id="infoPreview" class="preview">
                    </div>
                </div>
            </div>
            <div id="user" class="page">
                <iframe
                src = "https://paperio.site/"
                width = "900"
                height = "500"
                frameborder = "0"
                sandbox="allow-same-origin allow-scripts">
                </iframe>
            </div>
            <div id="analytics" class="page">
                <div id="currentData">
                    <canvas id="motionChart" class="currentChart widget" width="325" height="160"></canvas>
                    <canvas id="gripChart" class="currentChart widget" max-width="160" height="130"></canvas>
                    <canvas id="pastChart" class="pastChart widget" width="80" height="60"></canvas>
                    <div id="analysisBox" class="widget">
                        <p id="analysis">No data yet.</p>
                    </div>
                </div>
                <div id="historicalData">
                <img src="lib/dayIncrement.png" id="daybreak" class="widget btn">
                <img src="lib/darkDeliriumTile.png" id="dayend" class="widget btn">
                </div>
            </div>
            <div id="info" class="page">
                infoing
            </div>
        </div>

    </body>
    <!--mmm gsap :tongue:-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="main.js"></script>
</html>
